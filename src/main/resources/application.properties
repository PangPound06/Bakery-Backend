spring.application.name=my-project

# ════════════════════════════════════════════════════════════════════
# ค่าทั้งหมดในไฟล์นี้อ่านจาก environment variable (ตั้งใน Render)
# เครื่อง localhost ใช้ค่าจาก application-local.properties แทน
# (ไฟล์นั้นอยู่ใน .gitignore จึงไม่มีบน server — import ด้านล่างจะถูกข้ามไปเอง)
# ════════════════════════════════════════════════════════════════════
spring.config.import=optional:classpath:application-local.properties

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=30000

# JPA — schema จัดการเองด้วยไฟล์ SQL ใน db/ ไม่ให้ Hibernate แก้ตาราง
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# JWT
jwt.secret=${JWT_SECRET}

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI}
frontend.url=${FRONTEND_URL}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Stripe — ว่างได้ แต่ endpoint ชำระเงินจะตอบ 503 จนกว่าจะตั้งค่า
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=thb

# PromptPay ของร้าน — QR หน้า POS และการโอนที่แอดมินยืนยันเอง (เงินเข้าบัญชีร้านตรง ไม่ผ่าน Stripe)
promptpay.id=${PROMPTPAY_ID:0931253748}
promptpay.account-name=${PROMPTPAY_ACCOUNT_NAME:}

# Logging
logging.level.root=INFO
logging.level.com.app.my_project=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{20}] - %msg%n
